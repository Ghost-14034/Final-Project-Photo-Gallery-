<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body onload="addTabFocus()">

<h1>Interactive Photo Gallery</h1>

<div id="image">
    Hover over an image below to display here.
</div>

<img src="https://resources.travellocal.com/wp/uploads/2024/07/04145057/New-Zealand-Mount-Cook-ss-scaled.jpg"
     alt="Mountain landscape"
     onmouseover="upDate(this)"
     onmouseleave="undo()"
     onfocus="upDate(this)"
     onblur="undo()">

<img src="https://brownvethospital.com/wp-content/uploads/2024/02/when-do-dogs-stop-growing.jpg"
     alt="Cute dog"
     onmouseover="upDate(this)"
     onmouseleave="undo()"
     onfocus="upDate(this)"
     onblur="undo()">

     alt="Peaceful lake"
     onmouseover="upDate(this)"
     onmouseleave="undo()"

     onblur="undo()">

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSveY2qEz6GoBLyCV47CpnQ9xjYH0VctqpA_4fE52u_hPIeDYZx9X2ThKA&s=10"

     alt="city"

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQRG_h74w1lSqA80JoerszobCoKz1AOITJl-R3l2GKKB1yrwZiZw_yqYk&s=10"
     alt="Ocean waves"
     onmouseover="upDate(this)"

</html>
